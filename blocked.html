<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Seite blockiert</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eaeaea;
      text-align: center;
    }
    .box {
      max-width: 420px;
      padding: 32px;
    }
    .emoji {
      font-size: 56px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      color: #a0a0c0;
      line-height: 1.5;
    }
    .quote {
      margin-top: 24px;
      font-style: italic;
      color: #e94560;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="emoji">🎯</div>
    <h1>Diese Seite ist gerade blockiert</h1>
    <p>Du bist im Fokus-Modus. Bleib dran – diese Ablenkung kann warten.</p>
    <div class="quote">„Diszipliniert ist besser als motiviert."</div>
  </div>
</body>
</html>
